appId: com.arhaan.shortkut
productName: ShortKut
directories:
  output: dist
files:
  - out/**
  - package.json
mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # Signing/notarization: set CSC_LINK + CSC_KEY_PASSWORD (or CSC_NAME) and
  # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID once an Apple Developer
  # account exists. Unsigned builds still work locally (right-click → Open).
dmg:
  title: ShortKut
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
# Windows builds cross-compile from macOS via Wine (brew install --cask wine-stable),
# or natively on a Windows runner. Unsigned .exe triggers a SmartScreen warning until
# an EV/OV code-signing cert is configured (CSC_LINK + CSC_KEY_PASSWORD).
npmRebuild: false
